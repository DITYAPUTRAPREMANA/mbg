name: mobile
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Backend & Auth
  supabase_flutter: ^2.0.0
  flutter_dotenv: ^6.0.1

  # Kamera & API
  camera: ^0.10.5+5
  image_picker: ^1.0.7
  http: ^1.2.0

  # UI & State Management
  provider: ^6.1.1
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
